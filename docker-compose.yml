name: scada-student

services:
  plc:
    build: ./plc-emulator
    environment:
      PLC_SPEED: ${PLC_SPEED:-1}
    ports:
      - "${PLC_PORT:-5020}:5020"
    restart: unless-stopped

  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scada}
      POSTGRES_DB: ${POSTGRES_DB:-scada}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      MODBUS_URL: tcp://plc:5020
      DATABASE_URL: postgres://${POSTGRES_USER:-scada}:${POSTGRES_PASSWORD:-scada}@db:5432/${POSTGRES_DB:-scada}
      POLL_INTERVAL: ${POLL_INTERVAL:-1s}
    depends_on:
      db:
        condition: service_healthy
      plc:
        condition: service_started
    restart: unless-stopped

  fuxa:
    image: frangoteam/fuxa:1.3.5
    ports:
      - "${FUXA_PORT:-1881}:1881"
    volumes:
      - fuxa_appdata:/usr/src/app/FUXA/server/_appdata
      - fuxa_db:/usr/src/app/FUXA/server/_db
      - fuxa_logs:/usr/src/app/FUXA/server/_logs
      - fuxa_pkg:/usr/src/app/FUXA/server/_pkg
    depends_on:
      - plc
    restart: unless-stopped

volumes:
  pgdata:
  fuxa_appdata:
  fuxa_db:
  fuxa_logs:
  fuxa_pkg:
